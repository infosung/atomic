artifactAppOauthRedirect = "atomic.app.oauth.redirect"
artifactAppStorageApi = "atomic.app.storage.api"
artifactStarter = "atomic.starter"
artifactStorage = "atomic.storage"
artifactSpringOauth2 = "atomic.spring.oauth2"
artifactSpringWeb = "atomic.spring.web"
artifactSpringSecurity = "atomic.spring.security"
artifactSpringIdempotency = "atomic.spring.idempotency"
