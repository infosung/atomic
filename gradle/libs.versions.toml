pomDescriptionHeartbeat = "Atomic heartbeat monitoring module"

jdk18on = "1.82"
commonsImaging = "1.0.0-alpha6"
scrimage = "4.3.6"
thumbnailator = "0.4.21"
awsSdk = "2.31.70"
testcontainers = "1.20.6"
duckdbJdbc = "1.3.2.0"
oracleJdbc = "21.18.0.0"

springboot = "4.0.5"

[libraries]
# spring boot
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-data-redis = { module = "org.springframework.data:spring-data-redis" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-dependencies-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springboot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-data-jpa-test = { module = "org.springframework.boot:spring-boot-data-jpa-test" }
spring-boot-jdbc-test = { module = "org.springframework.boot:spring-boot-jdbc-test" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# jackson
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }

# jupiter
jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "jupiter" }
jupiter-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "jupiter" }
jupiter-bom = { group = "org.junit", name = "junit-bom", version.ref = "jupiter" }

bouncycastle = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "jdk18on" }
apache-commons-imaging = { group = "org.apache.commons", name = "commons-imaging", version.ref = "commonsImaging" }
scrimage-core = { group = "com.sksamuel.scrimage", name = "scrimage-core", version.ref = "scrimage" }
scrimage-webp = { group = "com.sksamuel.scrimage", name = "scrimage-webp", version.ref = "scrimage" }
thumbnailator = { group = "net.coobird", name = "thumbnailator", version.ref = "thumbnailator" }
aws-sdk-s3 = { group = "software.amazon.awssdk", name = "s3", version.ref = "awsSdk" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
testcontainers-oracle-free = { module = "org.testcontainers:oracle-free", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }
mysql = { module = "com.mysql:mysql-connector-j" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracleJdbc" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdbJdbc" }
snakeyaml = { module = "org.yaml:snakeyaml" }

# oauth
google-api-client = { group = "com.google.api-client", name = "google-api-client", version = "2.8.1" }

[plugins]
springboot = { id = "org.springframework.boot", version.ref = "springboot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementPlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublishPlugin" }
