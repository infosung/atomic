moduleDescriptionEventLogIceberg = "atomic-event-log-iceberg"
moduleDescriptionEventLogDuckdb = "atomic-event-log-duckdb"
moduleDescriptionEventLogSpringWeb = "atomic-event-log-spring-web"
moduleDescriptionAppVersion = "atomic-app-version"
