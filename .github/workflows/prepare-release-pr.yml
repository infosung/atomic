name: Prepare Release PR

on:
  workflow_run:
    workflows:
      - Tag And Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer, example: 0.0.3)"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      should_prepare: ${{ steps.resolve.outputs.should_prepare }}
      current_version: ${{ steps.resolve.outputs.current_version }}
      target_version: ${{ steps.resolve.outputs.target_version }}

    steps:
      - name: Checkout (workflow_run source SHA)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (default)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next release version
        id: resolve
        shell: bash
        run: |
          CURRENT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${CURRENT_VERSION}" ]; then
            echo "Failed to read projectVersion"
            exit 1
          fi

          SHOULD_PREPARE=false
          TARGET_VERSION=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
            if ! [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: ${TARGET_VERSION}. Use SemVer like 0.0.3"
              exit 1
            fi

            if [ "${CURRENT_VERSION}" = "${TARGET_VERSION}" ]; then
              echo "Version is already ${CURRENT_VERSION}"
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then
              echo "Tag v${TARGET_VERSION} already exists"
              exit 1
            fi

            SHOULD_PREPARE=true
          else
            if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "workflow_run head branch is not main; skipping."
            else
              if ! [[ "${CURRENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Current projectVersion is not SemVer x.y.z: ${CURRENT_VERSION}"
                exit 1
              fi

              SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
              RELEASE_TAG="v${CURRENT_VERSION}"
              TAG_AT_SHA=$(git tag --points-at "${SOURCE_SHA}" | grep -Fx "${RELEASE_TAG}" || true)
              if [ -z "${TAG_AT_SHA}" ] || ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
                echo "No release tag ${RELEASE_TAG} on source SHA ${SOURCE_SHA}; skipping."
              else
                IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
                TARGET_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                if git ls-remote --exit-code --tags origin "refs/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then
                  echo "Next tag already exists: v${TARGET_VERSION}; skipping."
                else
                  SHOULD_PREPARE=true
                fi
              fi
            fi
          fi

          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "target_version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_prepare=${SHOULD_PREPARE}" >> "$GITHUB_OUTPUT"

  prepare:
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.should_prepare == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update projectVersion
        shell: bash
        run: |
          TARGET_VERSION="${{ needs.resolve.outputs.target_version }}"
          perl -0pi -e 's/^projectVersion = ".*"$/projectVersion = "'"${TARGET_VERSION}"'"/m' gradle/libs.versions.toml
          grep -nE '^projectVersion = ' gradle/libs.versions.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: release/v${{ needs.resolve.outputs.target_version }}
          title: "chore(release): bump version to ${{ needs.resolve.outputs.target_version }}"
          commit-message: "chore(release): bump version to ${{ needs.resolve.outputs.target_version }}"
          body: |
            Automated release version bump.

            - Previous version: `${{ needs.resolve.outputs.current_version }}`
            - Updated `projectVersion` in `gradle/libs.versions.toml` to `${{ needs.resolve.outputs.target_version }}`
            - This PR was prepared after successful `Tag And Release`
          labels: |
            release
          add-paths: |
            gradle/libs.versions.toml
          delete-branch: true
