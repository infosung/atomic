name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer, example: 0.0.2)"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and update projectVersion
        shell: bash
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          if ! [[ "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${NEW_VERSION}. Use SemVer like 0.0.2"
            exit 1
          fi

          CURRENT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${CURRENT_VERSION}" ]; then
            echo "Failed to read projectVersion"
            exit 1
          fi

          if [ "${CURRENT_VERSION}" = "${NEW_VERSION}" ]; then
            echo "Version is already ${CURRENT_VERSION}"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists"
            exit 1
          fi

          perl -0pi -e 's/^projectVersion = ".*"$/projectVersion = "'"${NEW_VERSION}"'"/m' gradle/libs.versions.toml
          grep -nE '^projectVersion = ' gradle/libs.versions.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: release/v${{ github.event.inputs.version }}
          title: "chore(release): bump version to ${{ github.event.inputs.version }}"
          commit-message: "chore(release): bump version to ${{ github.event.inputs.version }}"
          body: |
            Automated release version bump.

            - Updated `projectVersion` in `gradle/libs.versions.toml` to `${{ github.event.inputs.version }}`
            - After merge to `main`, `tag-and-release.yml` creates tag `v${{ github.event.inputs.version }}` and GitHub Release
            - Tag push triggers `publish-maven-central.yml`
          labels: |
            release
          delete-branch: true
