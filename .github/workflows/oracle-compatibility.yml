name: Oracle Compatibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-oracle:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify Oracle compatibility contracts
        env:
          ATOMIC_RUN_ORACLE_COMPATIBILITY: "true"
        run: |
          ./gradlew --no-configuration-cache \
            :atomic-contract:test \
            --tests '*JdbcTableMetadataLoaderVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:app-version:test \
            --tests '*AppVersionOracleCompatibilityContractTest' \
            --tests '*ServiceVersionSqlAssetVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:storage-api:test \
            --tests '*AppImageOracleCompatibilityContractTest' \
            --tests '*ImageSqlAssetVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:oauth-redirect:test \
            --tests '*JpaOauthRelayCodeStoreOracleCompatibilityTest' \
            --tests '*OauthRelaySqlAssetVendorCompatibilityTest'
