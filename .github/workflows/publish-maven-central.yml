name: Publish Maven Central

on:
  workflow_run:
    workflows:
      - Tag And Release
    types:
      - completed
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout (workflow_run source SHA)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (default)
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard main branch on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "workflow_dispatch must run on refs/heads/main. current=${GITHUB_REF}"
            exit 1
          fi

      - name: Resolve release context
        id: resolve
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${PROJECT_VERSION}" ]; then
            echo "Failed to resolve projectVersion from gradle/libs.versions.toml"
            exit 1
          fi
          EXPECTED_TAG="v${PROJECT_VERSION}"
          SHOULD_PUBLISH=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
              CURRENT_HEAD=$(git rev-parse HEAD)
              TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")
              if [ "${CURRENT_HEAD}" != "${TAG_COMMIT}" ]; then
                echo "Manual publish requires HEAD to match ${EXPECTED_TAG}: head=${CURRENT_HEAD}, tag=${TAG_COMMIT}"
                exit 1
              fi
              SHOULD_PUBLISH=true
            else
              echo "Tag ${EXPECTED_TAG} not found on origin. Refusing manual publish."
              exit 1
            fi
          else
            if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
              TAG_AT_SHA=$(git tag --points-at "${SOURCE_SHA}" | grep -Fx "${EXPECTED_TAG}" || true)
              if [ -n "${TAG_AT_SHA}" ] && git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
                SHOULD_PUBLISH=true
              else
                echo "No release tag ${EXPECTED_TAG} on source SHA ${SOURCE_SHA}; skipping publish."
              fi
            else
              echo "workflow_run head branch is not main; skipping publish."
            fi
          fi

          echo "version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    if: needs.resolve.outputs.should_publish == 'true'

    steps:
      - name: Checkout (workflow_run source SHA)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (manual release tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard release version
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${PROJECT_VERSION}" ]; then
            echo "Failed to resolve projectVersion from gradle/libs.versions.toml"
            exit 1
          fi

          if [[ "${PROJECT_VERSION}" == *"-SNAPSHOT" ]]; then
            echo "SNAPSHOT version cannot be published to Maven Central: ${PROJECT_VERSION}"
            exit 1
          fi

          EXPECTED_TAG="v${PROJECT_VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
            echo "Release tag does not exist on origin: ${EXPECTED_TAG}"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "${TAG_COMMIT}" != "${SOURCE_SHA}" ]; then
              echo "Tag commit mismatch: ${EXPECTED_TAG} -> ${TAG_COMMIT}, workflow_run head_sha=${SOURCE_SHA}"
              exit 1
            fi
          else
            TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")
            CURRENT_HEAD=$(git rev-parse HEAD)
            if [ "${TAG_COMMIT}" != "${CURRENT_HEAD}" ]; then
              echo "Manual publish requires HEAD to match ${EXPECTED_TAG}: head=${CURRENT_HEAD}, tag=${TAG_COMMIT}"
              exit 1
            fi
          fi

          git fetch origin main
          TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Tag commit ${TAG_COMMIT} is not contained in origin/main"
            exit 1
          fi

          echo "Release version guard passed: projectVersion=${PROJECT_VERSION}, tag=${EXPECTED_TAG}"

      - name: Verify
        run: ./gradlew --no-configuration-cache spotlessCheck test

  publish:
    runs-on: ubuntu-latest
    needs:
      - resolve
      - verify
    permissions:
      contents: read
    if: needs.resolve.outputs.should_publish == 'true'
    concurrency:
      group: maven-central-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout (workflow_run source SHA)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout (manual release tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central sequentially
        shell: bash
        run: |
          set -euo pipefail

          MODULES=(
            atomic-contract
            atomic-storage
            atomic-spring-web
            atomic-spring-security
            atomic-spring-idempotency
            atomic-spring-oauth2
            atomic-heartbeat
            atomic-starter
            atomic-app:app-version
            atomic-app:oauth-redirect
            atomic-app:storage-api
            atomic-app
          )

          for MODULE in "${MODULES[@]}"; do
            echo "::group::Publish ${MODULE}"
            echo "Publishing module ${MODULE} for release tag ${{ needs.resolve.outputs.tag }}"
            ./gradlew --no-configuration-cache ":${MODULE}:publishAndReleaseToMavenCentral"
            echo "::endgroup::"
          done
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
