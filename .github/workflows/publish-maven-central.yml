name: Publish Maven Central

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "SemVer release tag to publish, for example v0.2.0"
        required: true
        type: string

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQUESTED_TAG="${{ inputs.release_tag }}"
          if ! [[ "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag input must be SemVer, for example v0.2.0: ${REQUESTED_TAG}"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/${REQUESTED_TAG}" >/dev/null 2>&1; then
            echo "Release tag does not exist on origin: ${REQUESTED_TAG}"
            exit 1
          fi

          if ! gh release view "${REQUESTED_TAG}" >/dev/null 2>&1; then
            echo "GitHub release does not exist: ${REQUESTED_TAG}"
            exit 1
          fi

          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      contents: read
    if: needs.resolve.outputs.should_publish == 'true'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Guard release version
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${PROJECT_VERSION}" ]; then
            echo "Failed to resolve projectVersion from gradle/libs.versions.toml"
            exit 1
          fi

          if [[ "${PROJECT_VERSION}" == *"-SNAPSHOT" ]]; then
            echo "SNAPSHOT version cannot be published to Maven Central: ${PROJECT_VERSION}"
            exit 1
          fi

          REQUESTED_TAG="${{ needs.resolve.outputs.tag }}"
          EXPECTED_TAG="v${PROJECT_VERSION}"
          if [ "${EXPECTED_TAG}" != "${REQUESTED_TAG}" ]; then
            echo "Release version does not match requested tag: requested=${REQUESTED_TAG}, projectVersion=${PROJECT_VERSION}"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
            echo "Release tag does not exist on origin: ${EXPECTED_TAG}"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "${EXPECTED_TAG}")
          CURRENT_HEAD=$(git rev-parse HEAD)
          if [ "${TAG_COMMIT}" != "${CURRENT_HEAD}" ]; then
            echo "Tag commit mismatch: ${EXPECTED_TAG} -> ${TAG_COMMIT}, checkout HEAD=${CURRENT_HEAD}"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Tag commit ${TAG_COMMIT} is not contained in origin/main"
            exit 1
          fi

          echo "Release version guard passed: projectVersion=${PROJECT_VERSION}, tag=${EXPECTED_TAG}"

      - name: Verify
        run: ./gradlew --no-configuration-cache spotlessCheck test

      - name: Verify Oracle compatibility release gate
        env:
          ATOMIC_RUN_ORACLE_COMPATIBILITY: "true"
        run: |
          ./gradlew --no-configuration-cache \
            :atomic-contract:test \
            --tests '*JdbcTableMetadataLoaderVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:app-version:test \
            --tests '*AppVersionOracleCompatibilityContractTest' \
            --tests '*ServiceVersionSqlAssetVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:storage-api:test \
            --tests '*AppImageOracleCompatibilityContractTest' \
            --tests '*ImageSqlAssetVendorCompatibilityTest'
          ./gradlew --no-configuration-cache \
            :atomic-app:oauth-redirect:test \
            --tests '*JpaOauthRelayCodeStoreOracleCompatibilityTest' \
            --tests '*OauthRelaySqlAssetVendorCompatibilityTest'

  publish:
    runs-on: ubuntu-latest
    needs:
      - resolve
      - verify
    permissions:
      contents: read
    if: needs.resolve.outputs.should_publish == 'true'
    concurrency:
      group: maven-central-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central sequentially
        shell: bash
        run: |
          set -euo pipefail

          MODULES=(
            atomic-event-log
            atomic-event-log:iceberg
            atomic-event-log:parquet
            atomic-event-log:duckdb
            atomic-event-log:spring-web
            atomic-event-log:ingest-api
            atomic-contract
            atomic-crypto
            atomic-storage
            atomic-spring-web
            atomic-spring-security
            atomic-spring-idempotency
            atomic-spring-oauth2
            atomic-heartbeat
            atomic-starter
            atomic-app:app-version
            atomic-app:oauth-redirect
            atomic-app:storage-api
            atomic-app
          )

          for MODULE in "${MODULES[@]}"; do
            echo "::group::Publish ${MODULE}"
            echo "Publishing module ${MODULE} for release tag ${{ needs.resolve.outputs.tag }}"
            ./gradlew --no-configuration-cache ":${MODULE}:publishAndReleaseToMavenCentral"
            echo "::endgroup::"
          done
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
