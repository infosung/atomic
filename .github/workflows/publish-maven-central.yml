name: Publish Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard main branch on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "workflow_dispatch must run on refs/heads/main. current=${GITHUB_REF}"
            exit 1
          fi

      - name: Guard tag commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${GITHUB_REF}")
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Tag commit ${TAG_COMMIT} is not contained in origin/main"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard release version
        shell: bash
        run: |
          PROJECT_VERSION=$(grep -E '^projectVersion = ' gradle/libs.versions.toml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${PROJECT_VERSION}" ]; then
            echo "Failed to resolve projectVersion from gradle/libs.versions.toml"
            exit 1
          fi

          if [[ "${PROJECT_VERSION}" == *"-SNAPSHOT" ]]; then
            echo "SNAPSHOT version cannot be published to Maven Central: ${PROJECT_VERSION}"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
              echo "Tag version and projectVersion mismatch: tag=${TAG_VERSION}, projectVersion=${PROJECT_VERSION}"
              exit 1
            fi
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)
          else
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          fi

          if [ -n "${PREV_TAG}" ]; then
            PREV_VERSION="${PREV_TAG#v}"
            if [ "${PROJECT_VERSION}" = "${PREV_VERSION}" ]; then
              echo "projectVersion is not bumped: current=${PROJECT_VERSION}, previous=${PREV_VERSION}"
              exit 1
            fi
          fi

          echo "Release version guard passed: projectVersion=${PROJECT_VERSION}, previousTag=${PREV_TAG:-none}"

      - name: Verify
        run: ./gradlew --no-configuration-cache spotlessCheck test

  publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - atomic-contract
          - atomic-storage
          - atomic-spring-web
          - atomic-spring-security
          - atomic-spring-idempotency
          - atomic-spring-oauth2
          - atomic-heartbeat
          - atomic-starter
          - "atomic-app:app-version"
          - "atomic-app:oauth-redirect"
          - "atomic-app:storage-api"
          - atomic-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew --no-configuration-cache :${{ matrix.module }}:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
