name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-04-10 verified against gradle/libs.versions.toml and official release pages:
          # Spring Boot 4.0.5 latest stable, 4.0.4 previous patch, Kotlin 2.3.20 latest stable.
          - springboot: "4.0.3"
            kotlin: "2.3.10"
            label: "baseline"
          - springboot: "4.0.2"
            kotlin: "2.3.10"
            label: "compat"
          - springboot: "4.0.1"
            kotlin: "2.3.10"
            label: "compat"
          - springboot: "4.0.3"
            kotlin: "2.3.0"
            label: "compat"
          - springboot: "4.0.4"
            kotlin: "2.3.10"
            label: "previous-stable-boot"
          - springboot: "4.0.5"
            kotlin: "2.3.10"
            label: "latest-boot"
          - springboot: "4.0.3"
            kotlin: "2.3.20"
            label: "latest-kotlin"
          - springboot: "4.0.5"
            kotlin: "2.3.20"
            label: "latest-stable"
    name: verify (boot=${{ matrix.springboot }}, kotlin=${{ matrix.kotlin }}, ${{ matrix.label }})
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply matrix versions
        run: |
          perl -0pi -e 's/^kotlin = ".*"$/kotlin = "${{ matrix.kotlin }}"/m; s/^springboot = ".*"$/springboot = "${{ matrix.springboot }}"/m' gradle/libs.versions.toml
          grep -nE '^(kotlin|springboot) = ' gradle/libs.versions.toml

      - name: Verify format and tests
        run: ./gradlew spotlessCheck test
